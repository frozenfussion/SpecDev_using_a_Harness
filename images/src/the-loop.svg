<rect x="320.0" y="1116" width="560" height="96" rx="48.0" fill="#0b1f14" stroke="#0b1f14" stroke-width="3"/>
<text x="600" y="1158.0" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Owner runs the Done-when checks</text>
<text x="600" y="1188.0" text-anchor="middle" font-size="20" fill="#c9f5dc">on the real thing</text>
<path d="M320 1164 H70 V220 H314" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#ab)"/>
<text x="88" y="1106" font-size="20" font-style="italic" fill="#b7791f" text-anchor="start">fails: fix, and record</text><text x="88" y="1132" font-size="20" font-style="italic" fill="#b7791f" text-anchor="start">the change in the spec</text>
<path d="M600 1212 V1256" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<text x="614" y="1242" font-size="20" font-style="italic" fill="#0b1f14" text-anchor="start">passes</text>
<rect x="320.0" y="1260" width="560" height="96" rx="48.0" fill="#0a8f4d" stroke="#0a8f4d" stroke-width="3"/>
<text x="600" y="1302.0" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Accepted</text>
<text x="600" y="1332.0" text-anchor="middle" font-size="20" fill="#c9f5dc">tag, merge to main, update the status file</text>
<path d="M600 1356 V1400" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<rect x="320.0" y="1404" width="560" height="96" rx="14" fill="#ffffff" stroke="#0b1f14" stroke-width="3"/>
<text x="600" y="1446.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0b1f14">Logs, tickets and handover updated</text>
<text x="600" y="1476.0" text-anchor="middle" font-size="20" fill="#4a5a52">so the next session starts cold and loses nothing</text>
<text x="600" y="1560" text-anchor="middle" font-size="22" fill="#4a5a52">Then the next stage starts again at the top.</text>
<text x="600" y="1600" text-anchor="middle" font-size="18" fill="#7a8a82">SpecDev using a Harness · Faysal Aziz</text></svg>