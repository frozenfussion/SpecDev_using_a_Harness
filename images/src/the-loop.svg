<rect x="320.0" y="460" width="560" height="84" rx="42.0" fill="#0b1f14" stroke="#0b1f14" stroke-width="3"/>
<text x="600" y="511.0" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Owner says go</text>
<path d="M470 544 V600 H330 V640" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<path d="M730 544 V600 H870 V640" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<rect x="110.0" y="644" width="440" height="96" rx="14" fill="#ffffff" stroke="#0b1f14" stroke-width="3"/>
<text x="330" y="686.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0b1f14">Builder AI: Part A</text>
<text x="330" y="716.0" text-anchor="middle" font-size="20" fill="#4a5a52">own branch, own list of files</text>
<rect x="650.0" y="644" width="440" height="96" rx="14" fill="#ffffff" stroke="#0b1f14" stroke-width="3"/>
<text x="870" y="686.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0b1f14">Builder AI: Part B</text>
<text x="870" y="716.0" text-anchor="middle" font-size="20" fill="#4a5a52">own branch, own list of files</text>
<text x="600" y="630" text-anchor="middle" font-size="20" font-style="italic" fill="#4a5a52">at the same time</text>
<path d="M330 740 V790 H520 V836" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<text x="345" y="778" font-size="20" font-style="italic" fill="#0b1f14" text-anchor="start">report</text>
<path d="M870 740 V790 H680 V836" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<text x="855" y="778" font-size="20" font-style="italic" fill="#0b1f14" text-anchor="end">report</text>
<rect x="320.0" y="840" width="560" height="96" rx="14" fill="#fff8e6" stroke="#b7791f" stroke-width="3"/>
<text x="600" y="882.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0b1f14">Code review against the spec</text>
<text x="600" y="912.0" text-anchor="middle" font-size="20" fill="#4a5a52">by a different AI: findings only</text>
<path d="M880 888 H1140 V692 H1096" fill="none" stroke="#b7791f" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#ab)"/>
<text x="1012" y="870" font-size="20" font-style="italic" fill="#b7791f" text-anchor="end">findings: fix</text>
<path d="M600 936 V980" fill="none" stroke="#0b1f14" stroke-width="3" marker-end="url(#ar)"/>
<text x="614" y="966" font-size="20" font-style="italic" fill="#0b1f14" text-anchor="start">clean</text>
<rect x="320.0" y="984" width="560" height="84" rx="14" fill="#ffffff" stroke="#0b1f14" stroke-width="3"/>
<text x="600" y="1020.0" text-anchor="middle" font-size="27" font-weight="700" fill="#0b1f14">Merge the Parts</text>
<text x="600" y="1050.0" text-anchor="middle" font-size="20" fill="#4a5a52">every check again on a clean copy</text>
