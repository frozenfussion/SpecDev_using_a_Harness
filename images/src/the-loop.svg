<rect width="1200" height="1640" fill="#ffffff"/>
<rect x="320.0" y="40" width="560" height="84" rx="42.0" fill="#0b1f14" stroke="#0b1f14" stroke-width="3"/>
<text x="600" y="76.0" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">Owner (a human)</text>
<text x="600" y="106.0" text-anchor="middle" font-size="20" fill="#c9f5dc">says what is wanted, and decides</text>
